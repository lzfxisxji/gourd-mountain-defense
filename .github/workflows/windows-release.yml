name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - run: npm run build:exe
      - name: Publish installer and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $folder = "release/$version"
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release v$version already published; leaving existing assets unchanged."; exit 0 }
          gh release create "v$version" "$folder/GourdMountainDefense-Setup-$version-x64.exe" "$folder/GourdMountainDefense-Setup-$version-x64.exe.blockmap" "$folder/latest.yml" --verify-tag --title "守护葫芦山 v$version" --generate-notes --latest
